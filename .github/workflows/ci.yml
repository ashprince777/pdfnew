name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Also copies the pdf.js and OCR assets into public/ (postinstall).
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Billing unit tests
        run: npm run test:billing

      # Builds the app twice (free site + billing against a fake Supabase) and drives
      # every tool in the runner's preinstalled Google Chrome.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: tests/.output/
          retention-days: 7
